  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #rounding-density-lab{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--foreground);padding:8px 2px 16px}#rounding-density-lab *{box-sizing:border-box}#rounding-density-lab h2{margin:0 0 12px;font-size:20px;font-weight:500}#rounding-density-lab h3{margin:18px 0 8px;font-size:16px;font-weight:500}

    #rounding-density-lab .curve{fill:none;stroke:var(--viz-series-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#rounding-density-lab .area{fill:var(--viz-series-3);fill-opacity:.28}#rounding-density-lab .bar{fill:var(--viz-series-1);fill-opacity:.55}#rounding-density-lab .bar.selected{fill:var(--viz-series-3);fill-opacity:.82}#rounding-density-lab .hist-overlay{fill:var(--viz-series-1);fill-opacity:.20;stroke:var(--viz-series-1);stroke-width:1}#rounding-density-lab .hist-overlay.selected{fill:var(--viz-series-3);fill-opacity:.28;stroke:var(--viz-series-3)}#rounding-density-lab .cut-grid{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}#rounding-density-lab .stem{stroke:var(--viz-series-1);stroke-width:2}#rounding-density-lab .stem-dot{fill:var(--viz-series-1)}#rounding-density-lab .stem.selected{stroke:var(--viz-series-3);stroke-width:3}#rounding-density-lab .stem-dot.selected{fill:var(--viz-series-3)}#rounding-density-lab .bound,#rounding-density-lab .u-guide{stroke:var(--viz-series-3);stroke-width:2;stroke-dasharray:5 4}#rounding-density-lab .u-shade{fill:var(--viz-series-3);fill-opacity:.28}#rounding-density-lab .u-line{fill:none;stroke:var(--viz-series-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#rounding-density-lab .u-point{fill:var(--viz-series-3)}#rounding-density-lab .secant{stroke:var(--viz-series-1);stroke-width:3}#rounding-density-lab .avg-box{fill:var(--viz-series-1);fill-opacity:.22;stroke:var(--viz-series-1);stroke-width:2}#rounding-density-lab .actual-point{fill:var(--viz-series-3)}
    #rounding-density-lab .context{margin:0 0 8px;color:var(--muted-foreground);font-size:13px}#rounding-density-lab .mapping{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:8px 0 10px;font-size:13px}#rounding-density-lab .mapping strong{font-weight:500;color:var(--viz-series-3)}#rounding-density-lab .view-switch{display:flex;justify-content:flex-end;gap:7px;margin:0 0 8px}#rounding-density-lab .tables{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}#rounding-density-lab .table-responsive{max-height:285px;overflow:auto}#rounding-density-lab table{width:100%;border-collapse:collapse;font-size:12px}#rounding-density-lab caption{text-align:left;font-weight:500;padding:0 0 6px}#rounding-density-lab th,#rounding-density-lab td{padding:5px 7px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}#rounding-density-lab th:first-child,#rounding-density-lab td:first-child{text-align:left}#rounding-density-lab thead{position:sticky;top:0;background:var(--background)}#rounding-density-lab tr.selected{background:var(--accent);color:var(--accent-foreground)}#rounding-density-lab .facets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}#rounding-density-lab .facet.active .panel-title{color:var(--viz-series-1)}#rounding-density-lab .facet.active svg{outline:2px solid var(--viz-series-1);outline-offset:2px}
    #rounding-density-lab .steps{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0 12px}#rounding-density-lab .step-arrow{color:var(--muted-foreground)}#rounding-density-lab .status{font-size:13px;color:var(--muted-foreground);min-height:20px;margin-top:9px;text-align:center}#rounding-density-lab .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:7px;font-size:12px}#rounding-density-lab .legend span{display:inline-flex;align-items:center;gap:6px}#rounding-density-lab .swatch{width:18px;height:9px;background:var(--viz-series-1);opacity:.55}#rounding-density-lab .line{width:21px;border-top:3px solid var(--viz-series-2)}#rounding-density-lab hr{margin:18px 0;border:0;border-top:1px solid var(--border)}

  &lt;h2&gt;Rounding continuous data and recovering a density curve&lt;/h2&gt;
  &lt;h3&gt;1. Reverse continuity correction&lt;/h3&gt;
  &lt;p class=&quot;context&quot;&gt;&lt;strong&gt;Meaning:&lt;/strong&gt; X is the food-delivery travel time from the moment an order leaves the restaurant until it reaches the customer. It is positive and can be measured to any precision. The app records Y by rounding X to the nearest whole minute.&lt;/p&gt;
  &lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Recorded food-delivery time, k = &lt;span id=&quot;rd-k&quot;&gt;12&lt;/span&gt; minutes&lt;input id=&quot;rd-k-slider&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;7&quot; max=&quot;17&quot; step=&quot;1&quot; value=&quot;12&quot;&gt;&lt;/label&gt;&lt;button id=&quot;rd-new&quot; class=&quot;btn&quot; type=&quot;button&quot;&gt;New sample&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;compare&quot;&gt;&lt;section&gt;&lt;div class=&quot;panel-title&quot;&gt;Actual food-delivery time X (continuous)&lt;/div&gt;&lt;svg id=&quot;rd-continuous&quot; role=&quot;img&quot; aria-label=&quot;Continuous food-delivery travel-time density with a highlighted rounding interval&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;panel-title&quot;&gt;Recorded time Y = round(X) (discrete)&lt;/div&gt;&lt;svg id=&quot;rd-rounded&quot; role=&quot;img&quot; aria-label=&quot;Discrete probability distribution of rounded food-delivery travel times&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;div class=&quot;mapping&quot; aria-live=&quot;polite&quot;&gt;&lt;span id=&quot;rd-interval&quot;&gt;11.5 ≤ X &amp;lt; 12.5&lt;/span&gt;&lt;span&gt;rounds to&lt;/span&gt;&lt;strong id=&quot;rd-result&quot;&gt;Y = 12&lt;/strong&gt;&lt;span&gt;and&lt;/span&gt;&lt;strong id=&quot;rd-prob&quot;&gt;P(Y = 12) = 0.197&lt;/strong&gt;&lt;/div&gt;
  &lt;div class=&quot;view-switch&quot; role=&quot;group&quot; aria-label=&quot;Distribution display&quot;&gt;&lt;button id=&quot;rd-show-tables&quot; class=&quot;btn btn-primary&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;Show tables&lt;/button&gt;&lt;button id=&quot;rd-show-bars&quot; class=&quot;btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Show as bar charts&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;tables&quot;&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot; aria-label=&quot;Population discrete probability distribution&quot;&gt;&lt;caption&gt;Population distribution after rounding&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Recorded k&lt;/th&gt;&lt;th&gt;Original X interval&lt;/th&gt;&lt;th&gt;Population proportion P(Y=k)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;rd-pop-body&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot; aria-label=&quot;Sample relative frequency and density distribution&quot;&gt;&lt;caption&gt;Sample distribution after rounding (n = 2400)&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Recorded k&lt;/th&gt;&lt;th&gt;Frequency&lt;/th&gt;&lt;th&gt;Relative frequency&lt;/th&gt;&lt;th&gt;Frequency density&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;rd-sample-body&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;rd-table-charts&quot; class=&quot;compare&quot; hidden&gt;&lt;section&gt;&lt;div class=&quot;panel-title&quot;&gt;Population: histogram + probability stems + theoretical density&lt;/div&gt;&lt;svg id=&quot;rd-pop-chart&quot; role=&quot;img&quot; aria-label=&quot;Population histogram with half-integer boundaries, discrete stems and theoretical density curve&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;panel-title&quot;&gt;Sample: histogram + frequency stems + theoretical density&lt;/div&gt;&lt;svg id=&quot;rd-sample-chart&quot; role=&quot;img&quot; aria-label=&quot;Sample histogram with half-integer boundaries, discrete stems and theoretical density curve&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;hr&gt;
  &lt;h3&gt;2. Recording the same food-delivery times more precisely&lt;/h3&gt;
  &lt;div class=&quot;steps&quot; aria-label=&quot;Bin-width controls&quot;&gt;&lt;button class=&quot;btn rd-width active&quot; type=&quot;button&quot; data-width=&quot;1&quot; aria-pressed=&quot;true&quot;&gt;Width 1.0&lt;/button&gt;&lt;span class=&quot;step-arrow&quot;&gt;→&lt;/span&gt;&lt;button class=&quot;btn rd-width&quot; type=&quot;button&quot; data-width=&quot;0.5&quot; aria-pressed=&quot;false&quot;&gt;Width 0.5&lt;/button&gt;&lt;span class=&quot;step-arrow&quot;&gt;→&lt;/span&gt;&lt;button class=&quot;btn rd-width&quot; type=&quot;button&quot; data-width=&quot;0.1&quot; aria-pressed=&quot;false&quot;&gt;Width 0.1&lt;/button&gt;&lt;button id=&quot;rd-animate&quot; class=&quot;btn btn-primary&quot; type=&quot;button&quot;&gt;Animate refinement&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;facets&quot;&gt;&lt;section class=&quot;facet active&quot; data-facet=&quot;1&quot;&gt;&lt;div class=&quot;panel-title&quot;&gt;Recorded to nearest 1 minute&lt;/div&gt;&lt;svg id=&quot;rd-h1&quot; role=&quot;img&quot; aria-label=&quot;Density histogram with bin width one minute&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;section class=&quot;facet&quot; data-facet=&quot;0.5&quot;&gt;&lt;div class=&quot;panel-title&quot;&gt;Recorded to nearest 0.5 minute&lt;/div&gt;&lt;svg id=&quot;rd-h05&quot; role=&quot;img&quot; aria-label=&quot;Density histogram with bin width half a minute&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;section class=&quot;facet&quot; data-facet=&quot;0.1&quot;&gt;&lt;div class=&quot;panel-title&quot;&gt;Recorded to nearest 0.1 minute&lt;/div&gt;&lt;svg id=&quot;rd-h01&quot; role=&quot;img&quot; aria-label=&quot;Density histogram with bin width one tenth of a minute&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;swatch&quot;&gt;&lt;/i&gt;Sample frequency density&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;line&quot;&gt;&lt;/i&gt;True probability density&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;rd-status&quot; class=&quot;status&quot; aria-live=&quot;polite&quot;&gt;Wide bins hide detail: each bar represents a whole one-minute interval.&lt;/div&gt;
  &lt;hr&gt;
  &lt;h3&gt;3. Continuous uniform distribution and its CDF&lt;/h3&gt;
  &lt;p class=&quot;context&quot;&gt;For X ~ U(2, 8), the PDF has constant height 1/(8 - 2) = 1/6. Moving x accumulates area under the PDF, and the same value appears as F(x) on the CDF.&lt;/p&gt;
  &lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Current x = &lt;span id=&quot;rd-u-x&quot;&gt;5.0&lt;/span&gt;&lt;input id=&quot;rd-u-slider&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;5&quot;&gt;&lt;/label&gt;&lt;button id=&quot;rd-u-animate&quot; class=&quot;btn btn-primary&quot; type=&quot;button&quot;&gt;Animate cumulative area&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;compare&quot;&gt;&lt;section&gt;&lt;div class=&quot;panel-title&quot;&gt;Uniform PDF f(x): accumulated area up to x&lt;/div&gt;&lt;svg id=&quot;rd-u-pdf&quot; role=&quot;img&quot; aria-label=&quot;Uniform probability density with cumulative area shaded&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;panel-title&quot;&gt;Uniform CDF F(x): accumulated probability&lt;/div&gt;&lt;svg id=&quot;rd-u-cdf&quot; role=&quot;img&quot; aria-label=&quot;Cumulative distribution function of a uniform random variable&quot;&gt;&lt;/svg&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;div id=&quot;rd-u-status&quot; class=&quot;mapping&quot; aria-live=&quot;polite&quot;&gt;&lt;span&gt;Area from 2 to 5.0&lt;/span&gt;&lt;strong&gt;= F(5.0) = 0.500&lt;/strong&gt;&lt;/div&gt;

  &lt;h3&gt;4. More well-known PDFs and CDFs&lt;/h3&gt;
